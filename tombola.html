<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tómbola JUNGLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Luckiest Guy', cursive;
      color: #ffffff;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(74px, 12vh, 115px) 20px 22px;
      background: #0b0b0b url('fondo-jungle.jpg') no-repeat center top fixed;
      background-size: cover;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle dark vignette behind drum & tray so balls pop clearly */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.68) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .top-controls {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-control {
      background: rgba(15, 15, 15, 0.85);
      color: #ffd500;
      border: 2px solid #ffd500;
      border-radius: 999px;
      padding: 8px 16px;
      font-family: 'Luckiest Guy', cursive;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      transition: transform 0.14s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .btn-control:hover {
      background: #ffd500;
      color: #111111;
      transform: translateY(-1px);
    }

    .btn-control:active {
      transform: scale(0.95);
    }

    .stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 980px;
      flex: 1;
      gap: 18px;
    }

    /* Giant Circular Tombola Drum */
    .drum-wrapper {
      position: relative;
      width: min(74vw, 430px);
      height: min(74vw, 430px);
      border-radius: 50%;
      padding: 14px;
      background: conic-gradient(
        from 0deg,
        #ffd500,
        #ff9900,
        #1a1a1a,
        #ffd500,
        #fff08a,
        #ff9900,
        #1a1a1a,
        #ffd500
      );
      box-shadow:
        0 0 35px rgba(255, 213, 0, 0.35),
        0 20px 50px rgba(0, 0, 0, 0.85),
        inset 0 0 18px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .drum-wrapper.spinning {
      box-shadow:
        0 0 55px rgba(255, 213, 0, 0.7),
        0 20px 55px rgba(0, 0, 0, 0.9),
        inset 0 0 18px rgba(0, 0, 0, 0.8);
      transform: scale(1.02);
    }

    .drum-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(48, 48, 48, 0.72), rgba(10, 10, 10, 0.92) 72%);
      border: 4px solid #111111;
      overflow: hidden;
      box-shadow: inset 0 12px 35px rgba(0, 0, 0, 0.9);
    }

    /* Glass shine overlay */
    .drum-inner::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.04) 36%,
        transparent 55%
      );
      pointer-events: none;
    }

    #drumCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .prompt-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(12, 12, 12, 0.84);
      border: 2px solid rgba(255, 213, 0, 0.7);
      border-radius: 999px;
      padding: 8px 20px;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      letter-spacing: 0.6px;
      color: #fff6c2;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .prompt-bar kbd {
      background: #ffd500;
      color: #111111;
      padding: 3px 12px;
      border-radius: 8px;
      font-family: 'Luckiest Guy', cursive;
      box-shadow: 0 3px 0 #b38600;
    }

    /* History Tray Under Tombola */
    .history-section {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 960px;
      background: rgba(12, 12, 12, 0.86);
      border: 3px solid #ffd500;
      border-radius: 22px;
      padding: 14px 20px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75), 0 0 20px rgba(255, 213, 0, 0.16);
      backdrop-filter: blur(6px);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px dashed rgba(255, 213, 0, 0.35);
    }

    .history-title {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      color: #ffd500;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .history-count {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      color: #ffffff;
      background: rgba(255, 213, 0, 0.18);
      border: 1.5px solid #ffd500;
      border-radius: 999px;
      padding: 3px 14px;
    }

    .history-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 58px;
      align-items: center;
      justify-content: center;
    }

    .history-empty {
      color: rgba(255, 255, 255, 0.48);
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    .drawn-ball {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      color: #111111;
      border: 2.5px solid #111111;
      background: radial-gradient(circle at 32% 28%, #ffffff 0%, #ffe659 38%, #ffb700 82%, #b57600 100%);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.65), inset 0 -3px 6px rgba(0, 0, 0, 0.25);
      animation: ballLand 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .drawn-ball.latest {
      box-shadow: 0 0 16px #ffd500, 0 5px 14px rgba(0, 0, 0, 0.75);
      transform: scale(1.08);
    }

    @keyframes ballLand {
      0% {
        opacity: 0;
        transform: scale(1.8) translateY(-24px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Giant Center Spotlight Overlay */
    #spotlight {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    #spotlight.active {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    #spotlight.closing .spotlight-ball {
      animation: flyDown 0.38s cubic-bezier(0.5, 0, 0.75, 0) forwards;
    }

    .spotlight-ball {
      width: min(56vw, 270px);
      height: min(56vw, 270px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(24vw, 7.2rem);
      color: #111111;
      border: 6px solid #111111;
      background: radial-gradient(circle at 30% 26%, #ffffff 0%, #fff085 28%, #ffd500 62%, #d98200 100%);
      box-shadow:
        0 0 60px rgba(255, 213, 0, 0.9),
        0 0 120px rgba(255, 190, 0, 0.55),
        0 24px 60px rgba(0, 0, 0, 0.85),
        inset 0 -14px 24px rgba(0, 0, 0, 0.28);
      animation: spotlightPop 0.45s cubic-bezier(0.18, 1.28, 0.32, 1);
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.45);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes spotlightPop {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-25deg);
      }
      70% {
        opacity: 1;
        transform: scale(1.08) rotate(4deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes flyDown {
      0% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      100% {
        opacity: 0;
        transform: scale(0.24) translateY(38vh);
      }
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <button class="btn-control" type="button" id="resetBtn">Reiniciar</button>
  </div>

  <main class="stage">
    <div class="drum-wrapper" id="drumWrapper" title="Haz clic o presiona Espacio para sacar una bolita">
      <div class="drum-inner">
        <canvas id="drumCanvas" width="440" height="440"></canvas>
      </div>
    </div>

    <div class="prompt-bar" id="promptBar">
      <span>Presiona</span>
      <kbd>ESPACIO</kbd>
      <span>para sacar bolita</span>
    </div>
  </main>

  <section class="history-section" aria-label="Bolitas que ya salieron">
    <div class="history-header">
      <div class="history-title">BOLITAS QUE HAN SALIDO</div>
      <div class="history-count" id="historyCount">0 / 20</div>
    </div>
    <div class="history-grid" id="historyGrid">
      <span class="history-empty">Aún no ha salido ninguna bolita...</span>
    </div>
  </section>

  <div id="spotlight" aria-live="polite">
    <div class="spotlight-ball" id="spotlightBall"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const TOTAL_BALLS = 20;
    const SPOTLIGHT_DURATION_MS = 2400;
    const SPIN_BOOST_MS = 380;

    const canvas = document.getElementById('drumCanvas');
    const ctx = canvas.getContext('2d');
    const drumWrapper = document.getElementById('drumWrapper');
    const historyGrid = document.getElementById('historyGrid');
    const historyCount = document.getElementById('historyCount');
    const promptBar = document.getElementById('promptBar');
    const spotlight = document.getElementById('spotlight');
    const spotlightBall = document.getElementById('spotlightBall');
    const resetBtn = document.getElementById('resetBtn');

    const CENTER = canvas.width / 2;
    const DRUM_RADIUS = canvas.width / 2 - 10;
    const BALL_RADIUS = 23;

    const BALL_STYLES = [
      { bg1: '#ffffff', bg2: '#ffe96b', bg3: '#f5a600', text: '#111111' },
      { bg1: '#555555', bg2: '#1f1f1f', bg3: '#050505', text: '#ffd500' },
      { bg1: '#ffffff', bg2: '#fff3a8', bg3: '#ffd500', text: '#111111' },
      { bg1: '#fff8d6', bg2: '#ffd500', bg3: '#c77d00', text: '#111111' }
    ];

    let balls = [];
    let drawnNumbers = [];
    let isSpinning = false;
    let activeSpotlightNum = null;
    let spotlightTimer = null;
    let boostMultiplier = 1;

    function createBalls() {
      balls = [];
      for (let num = 1; num <= TOTAL_BALLS; num++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (DRUM_RADIUS - BALL_RADIUS - 14);
        const speed = 1.6 + Math.random() * 1.4;
        const dir = Math.random() * Math.PI * 2;
        balls.push({
          num,
          x: CENTER + Math.cos(angle) * dist,
          y: CENTER + Math.sin(angle) * dist,
          vx: Math.cos(dir) * speed,
          vy: Math.sin(dir) * speed,
          style: BALL_STYLES[(num - 1) % BALL_STYLES.length]
        });
      }
    }

    function updatePhysics() {
      const maxSpeed = 4.2 * boostMultiplier;
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];

        // Gentle swirl force around the center
        const dxCenter = b.x - CENTER;
        const dyCenter = b.y - CENTER;
        b.vx += (-dyCenter * 0.00045) * boostMultiplier;
        b.vy += (dxCenter * 0.00045) * boostMultiplier;

        // Clamp speed
        const spd = Math.hypot(b.vx, b.vy);
        if (spd > maxSpeed) {
          b.vx = (b.vx / spd) * maxSpeed;
          b.vy = (b.vy / spd) * maxSpeed;
        }

        b.x += b.vx;
        b.y += b.vy;

        // Bounce off circular drum wall
        const dx = b.x - CENTER;
        const dy = b.y - CENTER;
        const dist = Math.hypot(dx, dy);
        const limit = DRUM_RADIUS - BALL_RADIUS;
        if (dist > limit && dist > 0) {
          const nx = dx / dist;
          const ny = dy / dist;
          b.x = CENTER + nx * limit;
          b.y = CENTER + ny * limit;
          const dot = b.vx * nx + b.vy * ny;
          b.vx -= 2 * dot * nx;
          b.vy -= 2 * dot * ny;
        }
      }

      // Simple ball-to-ball collisions
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const a = balls[i];
          const b = balls[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = BALL_RADIUS * 2;
          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) / 2;
            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;

            const dvx = a.vx - b.vx;
            const dvy = a.vy - b.vy;
            const rel = dvx * nx + dvy * ny;
            if (rel > 0) {
              a.vx -= rel * nx;
              a.vy -= rel * ny;
              b.vx += rel * nx;
              b.vy += rel * ny;
            }
          }
        }
      }
    }

    function drawBalls() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const b of balls) {
        const grad = ctx.createRadialGradient(
          b.x - BALL_RADIUS * 0.35,
          b.y - BALL_RADIUS * 0.35,
          2,
          b.x,
          b.y,
          BALL_RADIUS
        );
        grad.addColorStop(0, b.style.bg1);
        grad.addColorStop(0.45, b.style.bg2);
        grad.addColorStop(1, b.style.bg3);

        ctx.beginPath();
        ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#111111';
        ctx.stroke();

        ctx.fillStyle = b.style.text;
        ctx.font = '22px "Luckiest Guy", cursive';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(b.num), b.x, b.y + 2);
      }
    }

    function loop() {
      updatePhysics();
      drawBalls();
      requestAnimationFrame(loop);
    }

    function renderHistory() {
      historyCount.textContent = `${drawnNumbers.length} / ${TOTAL_BALLS}`;
      historyGrid.innerHTML = '';

      if (drawnNumbers.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'history-empty';
        empty.textContent = 'Aún no ha salido ninguna bolita...';
        historyGrid.appendChild(empty);
        return;
      }

      drawnNumbers.forEach((num, idx) => {
        const ballEl = document.createElement('div');
        ballEl.className = 'drawn-ball';
        if (idx === drawnNumbers.length - 1) {
          ballEl.classList.add('latest');
        }
        ballEl.textContent = num;
        historyGrid.appendChild(ballEl);
      });
    }

    function commitSpotlightBall(immediate = false) {
      if (activeSpotlightNum === null) return;
      const numToCommit = activeSpotlightNum;
      activeSpotlightNum = null;

      if (spotlightTimer) {
        clearTimeout(spotlightTimer);
        spotlightTimer = null;
      }

      if (immediate) {
        spotlight.classList.remove('active', 'closing');
        drawnNumbers.push(numToCommit);
        renderHistory();
        updatePromptState();
        return;
      }

      spotlight.classList.add('closing');
      setTimeout(() => {
        spotlight.classList.remove('active', 'closing');
        drawnNumbers.push(numToCommit);
        renderHistory();
        updatePromptState();
      }, 360);
    }

    function updatePromptState() {
      if (balls.length === 0 && activeSpotlightNum === null) {
        promptBar.innerHTML = '<span>¡Salieron las 20 bolitas! Presiona <strong>Reiniciar</strong> para otra ronda</span>';
      } else {
        promptBar.innerHTML = '<span>Presiona</span> <kbd>ESPACIO</kbd> <span>para sacar bolita</span>';
      }
    }

    function drawNextBall() {
      if (isSpinning) return;

      // If a ball is currently shown in spotlight, move it to history first
      if (activeSpotlightNum !== null) {
        commitSpotlightBall(true);
      }

      if (balls.length === 0) return;

      isSpinning = true;
      boostMultiplier = 3.2;
      drumWrapper.classList.add('spinning');

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * balls.length);
        const [selected] = balls.splice(randomIndex, 1);

        boostMultiplier = 1;
        drumWrapper.classList.remove('spinning');
        isSpinning = false;

        activeSpotlightNum = selected.num;
        spotlightBall.textContent = selected.num;
        spotlight.classList.remove('closing');
        spotlight.classList.add('active');

        if (typeof confetti === 'function') {
          confetti({
            particleCount: balls.length === 0 ? 120 : 35,
            spread: balls.length === 0 ? 90 : 55,
            origin: { y: 0.5 },
            colors: ['#ffd500', '#ffffff', '#ff9900', '#111111']
          });
        }

        spotlightTimer = setTimeout(() => {
          commitSpotlightBall(false);
        }, SPOTLIGHT_DURATION_MS);
      }, SPIN_BOOST_MS);
    }

    function resetTombola() {
      if (spotlightTimer) {
        clearTimeout(spotlightTimer);
        spotlightTimer = null;
      }
      activeSpotlightNum = null;
      isSpinning = false;
      boostMultiplier = 1;
      drumWrapper.classList.remove('spinning');
      spotlight.classList.remove('active', 'closing');
      drawnNumbers = [];
      createBalls();
      renderHistory();
      updatePromptState();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        drawNextBall();
      }
    });

    drumWrapper.addEventListener('click', drawNextBall);
    resetBtn.addEventListener('click', resetTombola);

    createBalls();
    renderHistory();
    updatePromptState();
    loop();
  </script>
</body>
</html>
