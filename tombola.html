<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tómbola JUNGLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Luckiest Guy', cursive;
      color: #ffffff;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 22px;
      background: #0a0a0a url('fondo-jungle.jpg') no-repeat center 72% fixed;
      background-size: cover;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle dark vignette behind drum & tray so balls pop clearly */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.65) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top JUNGLE Logo (black-filled PNG with solid yellow outline) */
    .jungle-logo {
      position: relative;
      z-index: 3;
      width: min(432px, 78vw);
      height: auto;
      max-height: 124px;
      object-fit: contain;
      flex-shrink: 0;
      margin-top: 6px;
      margin-bottom: 6px;
      filter:
        drop-shadow(2px 0 0 #ffd500)
        drop-shadow(-2px 0 0 #ffd500)
        drop-shadow(0 2px 0 #ffd500)
        drop-shadow(0 -2px 0 #ffd500)
        drop-shadow(2px 2px 0 #ffd500)
        drop-shadow(-2px -2px 0 #ffd500)
        drop-shadow(2px -2px 0 #ffd500)
        drop-shadow(-2px 2px 0 #ffd500)
        drop-shadow(0 0 10px rgba(255, 213, 0, 0.55));
    }

    .stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 980px;
      flex: 1;
      margin: 4px 0 10px;
    }

    /* Giant Circular Tombola Drum (+45% larger) */
    .drum-wrapper {
      position: relative;
      width: min(86vw, 62vh, 610px);
      height: min(86vw, 62vh, 610px);
      border-radius: 50%;
      padding: 13px;
      background: conic-gradient(
        from 0deg,
        #ffd500,
        #ff9900,
        #1a1a1a,
        #ffd500,
        #fff08a,
        #ff9900,
        #1a1a1a,
        #ffd500
      );
      box-shadow:
        0 0 35px rgba(255, 213, 0, 0.35),
        0 20px 50px rgba(0, 0, 0, 0.85),
        inset 0 0 18px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .drum-wrapper.spinning {
      box-shadow:
        0 0 60px rgba(255, 213, 0, 0.78),
        0 20px 55px rgba(0, 0, 0, 0.9),
        inset 0 0 18px rgba(0, 0, 0, 0.8);
      transform: scale(1.025);
    }

    .drum-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(44, 44, 44, 0.74), rgba(8, 8, 8, 0.94) 74%);
      border: 4px solid #111111;
      overflow: hidden;
      box-shadow: inset 0 12px 35px rgba(0, 0, 0, 0.92);
    }

    /* Glass shine overlay */
    .drum-inner::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.04) 36%,
        transparent 55%
      );
      pointer-events: none;
    }

    #drumCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* History Tray Under Tombola (Clean, no title text, ordinal 1..20) */
    .history-section {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 960px;
      background: rgba(12, 12, 12, 0.84);
      border: 3px solid #ffd500;
      border-radius: 22px;
      padding: 14px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75), 0 0 20px rgba(255, 213, 0, 0.16);
      backdrop-filter: blur(6px);
    }

    .history-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 54px;
      align-items: center;
      justify-content: center;
    }

    .drawn-ball {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #111111;
      border: 2.5px solid #111111;
      background: radial-gradient(circle at 32% 28%, #ffffff 0%, #ffe659 38%, #ffb700 82%, #b57600 100%);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.65), inset 0 -3px 6px rgba(0, 0, 0, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .drawn-ball.latest {
      box-shadow: 0 0 18px #ffd500, 0 0 8px #ffffff, 0 5px 14px rgba(0, 0, 0, 0.8);
      transform: scale(1.12);
      animation: ballLand 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes ballLand {
      0% {
        opacity: 0;
        transform: scale(1.7) translateY(-18px);
      }
      100% {
        opacity: 1;
        transform: scale(1.12) translateY(0);
      }
    }

    /* Giant Center Spotlight Overlay */
    #spotlight {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    #spotlight.active {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    #spotlight.closing .spotlight-ball {
      animation: flyDown 0.36s cubic-bezier(0.5, 0, 0.75, 0) forwards;
    }

    .spotlight-ball {
      width: min(56vw, 270px);
      height: min(56vw, 270px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(24vw, 7.2rem);
      color: #111111;
      border: 6px solid #111111;
      background: radial-gradient(circle at 30% 26%, #ffffff 0%, #fff085 28%, #ffd500 62%, #d98200 100%);
      box-shadow:
        0 0 60px rgba(255, 213, 0, 0.9),
        0 0 120px rgba(255, 190, 0, 0.55),
        0 24px 60px rgba(0, 0, 0, 0.85),
        inset 0 -14px 24px rgba(0, 0, 0, 0.28);
      animation: spotlightPop 0.45s cubic-bezier(0.18, 1.28, 0.32, 1);
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.45);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes spotlightPop {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-25deg);
      }
      70% {
        opacity: 1;
        transform: scale(1.08) rotate(4deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes flyDown {
      0% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      100% {
        opacity: 0;
        transform: scale(0.24) translateY(38vh);
      }
    }
  </style>
</head>
<body>
  <img src="logo-jungle.png" alt="JUNGLE" class="jungle-logo" />

  <main class="stage">
    <div class="drum-wrapper" id="drumWrapper" title="Presiona Espacio o haz clic para sacar una bolita">
      <div class="drum-inner">
        <canvas id="drumCanvas" width="600" height="600"></canvas>
      </div>
    </div>
  </main>

  <section class="history-section" aria-label="Números extraídos">
    <div class="history-grid" id="historyGrid"></div>
  </section>

  <div id="spotlight" aria-live="polite">
    <div class="spotlight-ball" id="spotlightBall"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const TOTAL_BALLS = 20;
    const SPOTLIGHT_DURATION_MS = 2400;
    const SPIN_BOOST_MS = 400;

    const canvas = document.getElementById('drumCanvas');
    const ctx = canvas.getContext('2d');
    const drumWrapper = document.getElementById('drumWrapper');
    const historyGrid = document.getElementById('historyGrid');
    const spotlight = document.getElementById('spotlight');
    const spotlightBall = document.getElementById('spotlightBall');

    const CENTER = canvas.width / 2;
    const DRUM_RADIUS = canvas.width / 2 - 14;
    const BALL_RADIUS = 28;
    const GRAVITY = 0.23;
    const RESTITUTION = 0.84;
    const WALL_RESTITUTION = 0.78;
    const MAX_PARTICLES = 120;

    const BALL_STYLES = [
      { bg1: '#ffffff', bg2: '#ffe96b', bg3: '#f5a600', text: '#111111' },
      { bg1: '#555555', bg2: '#1f1f1f', bg3: '#050505', text: '#ffd500' },
      { bg1: '#ffffff', bg2: '#fff3a8', bg3: '#ffd500', text: '#111111' },
      { bg1: '#fff8d6', bg2: '#ffd500', bg3: '#c77d00', text: '#111111' }
    ];

    let balls = [];
    let particles = [];
    let drawnNumbers = [];
    let latestDrawn = null;
    let isSpinning = false;
    let activeSpotlightNum = null;
    let spotlightTimer = null;
    let boostMultiplier = 1;
    let drumAngle = 0;

    function createBalls() {
      balls = [];
      particles = [];
      for (let num = 1; num <= TOTAL_BALLS; num++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (DRUM_RADIUS - BALL_RADIUS - 20);
        const speed = 1.5 + Math.random() * 2.5;
        const dir = Math.random() * Math.PI * 2;
        balls.push({
          num,
          x: CENTER + Math.cos(angle) * dist,
          y: CENTER + Math.sin(angle) * dist,
          vx: Math.cos(dir) * speed,
          vy: Math.sin(dir) * speed,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.08,
          style: BALL_STYLES[(num - 1) % BALL_STYLES.length]
        });
      }
    }

    function spawnParticles(x, y, intensity = 1) {
      if (particles.length >= MAX_PARTICLES) return;
      const count = Math.min(6, Math.max(2, Math.floor(intensity * 2.2)));
      const colors = ['#ffd500', '#ffffff', '#ffae00'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.0 + Math.random() * (2.2 * Math.min(intensity, 2.2));
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.4,
          radius: 1.5 + Math.random() * 2.2,
          life: 1.0,
          decay: 0.045 + Math.random() * 0.04,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function updatePhysics() {
      drumAngle += 0.022 * boostMultiplier;

      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];

        // Downward gravity
        b.vy += GRAVITY;

        // Rotating drum air / paddle lift near the bottom & sides
        const dxC = b.x - CENTER;
        const dyC = b.y - CENTER;
        const distC = Math.hypot(dxC, dyC) || 1;
        const tangentialStrength = (0.048 + (distC / DRUM_RADIUS) * 0.055) * boostMultiplier;
        const tx = -dyC / distC;
        const ty = dxC / distC;
        b.vx += tx * tangentialStrength;
        b.vy += ty * tangentialStrength;

        // Updraft kick when balls settle at the bottom of the drum
        if (dyC > DRUM_RADIUS * 0.42 && Math.random() < 0.09 * boostMultiplier) {
          b.vy -= (2.8 + Math.random() * 2.6) * Math.min(boostMultiplier, 2.0);
          b.vx += (Math.random() - 0.5) * 3.0;
        }

        // Gentle damping & speed cap
        b.vx *= 0.996;
        b.vy *= 0.996;
        const maxSpeed = 10.5 * Math.min(boostMultiplier, 1.8);
        const spd = Math.hypot(b.vx, b.vy);
        if (spd > maxSpeed) {
          b.vx = (b.vx / spd) * maxSpeed;
          b.vy = (b.vy / spd) * maxSpeed;
        }

        b.x += b.vx;
        b.y += b.vy;
        b.rot += b.vrot;

        // Collision against inner circular drum wall
        const dx = b.x - CENTER;
        const dy = b.y - CENTER;
        const dist = Math.hypot(dx, dy);
        const limit = DRUM_RADIUS - BALL_RADIUS;
        if (dist > limit && dist > 0) {
          const nx = dx / dist;
          const ny = dy / dist;
          b.x = CENTER + nx * limit;
          b.y = CENTER + ny * limit;

          const vn = b.vx * nx + b.vy * ny;
          if (vn > 0) {
            b.vx -= (1 + WALL_RESTITUTION) * vn * nx;
            b.vy -= (1 + WALL_RESTITUTION) * vn * ny;
            // Add tangential friction from spinning drum wall
            b.vx += -ny * (0.45 * boostMultiplier);
            b.vy += nx * (0.45 * boostMultiplier);
            b.vrot = (b.vx * -ny + b.vy * nx) * 0.03;

            if (vn > 2.4) {
              spawnParticles(b.x + nx * BALL_RADIUS, b.y + ny * BALL_RADIUS, vn / 3.2);
            }
          }
        }
      }

      // Elastic ball-to-ball collisions with particle sparks
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const a = balls[i];
          const b = balls[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = BALL_RADIUS * 2;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) / 2;

            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;

            const rvx = b.vx - a.vx;
            const rvy = b.vy - a.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            if (velAlongNormal < 0) {
              const impulse = -(1 + RESTITUTION) * velAlongNormal / 2;
              const ix = impulse * nx;
              const iy = impulse * ny;
              a.vx -= ix;
              a.vy -= iy;
              b.vx += ix;
              b.vy += iy;

              a.vrot += (Math.random() - 0.5) * 0.06;
              b.vrot += (Math.random() - 0.5) * 0.06;

              const impact = Math.abs(velAlongNormal);
              if (impact > 2.1) {
                const cx = (a.x + b.x) / 2;
                const cy = (a.y + b.y) / 2;
                spawnParticles(cx, cy, impact / 2.8);
              }
            }
          }
        }
      }

      // Update collision particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawDrumPaddles() {
      ctx.save();
      ctx.translate(CENTER, CENTER);
      ctx.rotate(drumAngle);
      ctx.strokeStyle = 'rgba(255, 213, 0, 0.22)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        const a = (k * Math.PI * 2) / 3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * (DRUM_RADIUS * 0.58), Math.sin(a) * (DRUM_RADIUS * 0.58));
        ctx.lineTo(Math.cos(a) * (DRUM_RADIUS - 6), Math.sin(a) * (DRUM_RADIUS - 6));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBallsAndParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawDrumPaddles();

      for (const b of balls) {
        const grad = ctx.createRadialGradient(
          b.x - BALL_RADIUS * 0.35,
          b.y - BALL_RADIUS * 0.35,
          2,
          b.x,
          b.y,
          BALL_RADIUS
        );
        grad.addColorStop(0, b.style.bg1);
        grad.addColorStop(0.45, b.style.bg2);
        grad.addColorStop(1, b.style.bg3);

        ctx.beginPath();
        ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#111111';
        ctx.stroke();

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(Math.sin(b.rot) * 0.22);
        ctx.fillStyle = b.style.text;
        ctx.font = '26px "Luckiest Guy", cursive';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(b.num), 0, 2);
        ctx.restore();
      }

      // Draw collision particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function loop() {
      updatePhysics();
      drawBallsAndParticles();
      requestAnimationFrame(loop);
    }

    function renderHistory() {
      historyGrid.innerHTML = '';

      // Always display drawn balls in ascending ordinal order (1 to 20)
      const sorted = [...drawnNumbers].sort((a, b) => a - b);

      sorted.forEach((num) => {
        const ballEl = document.createElement('div');
        ballEl.className = 'drawn-ball';
        if (num === latestDrawn) {
          ballEl.classList.add('latest');
        }
        ballEl.textContent = num;
        historyGrid.appendChild(ballEl);
      });
    }

    function commitSpotlightBall(immediate = false) {
      if (activeSpotlightNum === null) return;
      const numToCommit = activeSpotlightNum;
      activeSpotlightNum = null;

      if (spotlightTimer) {
        clearTimeout(spotlightTimer);
        spotlightTimer = null;
      }

      const finalize = () => {
        spotlight.classList.remove('active', 'closing');
        drawnNumbers.push(numToCommit);
        latestDrawn = numToCommit;
        renderHistory();
      };

      if (immediate) {
        finalize();
        return;
      }

      spotlight.classList.add('closing');
      setTimeout(finalize, 340);
    }

    function drawNextBall() {
      if (isSpinning) return;

      if (activeSpotlightNum !== null) {
        commitSpotlightBall(true);
      }

      if (balls.length === 0) return;

      isSpinning = true;
      boostMultiplier = 3.0;
      drumWrapper.classList.add('spinning');

      // Extra upward burst to agitate balls before picking
      balls.forEach((b) => {
        b.vy -= 3.5 + Math.random() * 3.5;
        b.vx += (Math.random() - 0.5) * 5.0;
      });

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * balls.length);
        const [selected] = balls.splice(randomIndex, 1);

        boostMultiplier = 1;
        drumWrapper.classList.remove('spinning');
        isSpinning = false;

        activeSpotlightNum = selected.num;
        spotlightBall.textContent = selected.num;
        spotlight.classList.remove('closing');
        spotlight.classList.add('active');

        if (typeof confetti === 'function') {
          confetti({
            particleCount: balls.length === 0 ? 120 : 35,
            spread: balls.length === 0 ? 90 : 55,
            origin: { y: 0.5 },
            colors: ['#ffd500', '#ffffff', '#ff9900', '#111111']
          });
        }

        spotlightTimer = setTimeout(() => {
          commitSpotlightBall(false);
        }, SPOTLIGHT_DURATION_MS);
      }, SPIN_BOOST_MS);
    }

    function resetTombola() {
      if (spotlightTimer) {
        clearTimeout(spotlightTimer);
        spotlightTimer = null;
      }
      activeSpotlightNum = null;
      isSpinning = false;
      boostMultiplier = 1;
      drumWrapper.classList.remove('spinning');
      spotlight.classList.remove('active', 'closing');
      drawnNumbers = [];
      latestDrawn = null;
      createBalls();
      renderHistory();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        drawNextBall();
      }
    });

    drumWrapper.addEventListener('click', drawNextBall);

    createBalls();
    renderHistory();
    loop();
  </script>
</body>
</html>
