<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lotería JUNGLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Luckiest Guy', cursive;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(120px, 21vh, 190px) 16px 36px;
      background: #0d0d0d url('fondo-jungle.jpg') no-repeat center top fixed;
      background-size: cover;
      overflow-x: hidden;
    }

    .card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 260px;
      margin-top: 12px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid #111111;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.2rem, 8vw, 2.8rem);
      color: #111111;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55), inset 0 -4px 0 rgba(0, 0, 0, 0.08);
      transition: transform 0.14s ease, border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .cell:active {
      transform: scale(0.94);
    }

    .cell.marked {
      background: #ffffff;
      border-color: #01afff;
      color: #0077b6;
      transform: scale(1.03);
      box-shadow: 0 0 14px #01afff, 0 0 28px rgba(1, 175, 255, 0.8), 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    #whatsappBtn {
      display: none;
      margin-top: 28px;
      padding: 14px 26px;
      background-color: #25d366;
      color: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 14px;
      font-family: 'Luckiest Guy', cursive;
      font-size: 1.25rem;
      letter-spacing: 0.6px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease, background-color 0.2s ease;
      animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #whatsappBtn:hover {
      background-color: #1ebe5b;
      transform: translateY(-2px);
    }

    #whatsappBtn:active {
      transform: scale(0.96);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.75) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="card-wrapper">
    <div id="grid" aria-label="Cartón de lotería de 6 números"></div>
    <button id="whatsappBtn" type="button" onclick="sendWhatsApp()">Enviar por WhatsApp</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const TOTAL_NUMBERS = 20;
    const CARD_SIZE = 6;
    const grid = document.getElementById('grid');
    const whatsappBtn = document.getElementById('whatsappBtn');

    function generateUniqueRandomNumbers(max, count) {
      const pool = Array.from({ length: max }, (_, i) => i + 1);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, count);
    }

    const cardNumbers = generateUniqueRandomNumbers(TOTAL_NUMBERS, CARD_SIZE);
    let confettiFired = false;

    function checkCompletion() {
      const cells = grid.querySelectorAll('.cell');
      const markedCount = grid.querySelectorAll('.cell.marked').length;
      const isComplete = markedCount === cells.length;

      if (isComplete) {
        whatsappBtn.style.display = 'block';
        if (!confettiFired && typeof confetti === 'function') {
          confettiFired = true;
          confetti({
            particleCount: 110,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#ffd500', '#01afff', '#ffffff', '#25d366', '#111111']
          });
        }
      } else {
        whatsappBtn.style.display = 'none';
        confettiFired = false;
      }
    }

    cardNumbers.forEach((num) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = num;
      cell.setAttribute('role', 'button');
      cell.setAttribute('tabindex', '0');
      cell.setAttribute('aria-pressed', 'false');

      const toggleCell = () => {
        const marked = cell.classList.toggle('marked');
        cell.setAttribute('aria-pressed', String(marked));
        checkCompletion();
      };

      cell.addEventListener('click', toggleCell);
      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleCell();
        }
      });

      grid.appendChild(cell);
    });

    function sendWhatsApp() {
      const message = `¡LOTERÍA JUNGLE! Completé mi cartón con los números: ${cardNumbers.join(', ')}`;
      const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }
  </script>
</body>
</html>
